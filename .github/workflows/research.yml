# Listing research for the quote watcher. Runs only on the research branch; results are plain JSON
# of public data (StonkFun, Raydium, Jupiter, Solana RPC), committed back to research/out.
name: research
on:
  push:
    branches: [research]
    paths: ['research/*.mjs', 'research/JOB', '.github/workflows/research.yml']
permissions:
  contents: write
concurrency:
  group: research-${{ github.sha }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: run job
        run: |
          JOB=$(tr -d '[:space:]' < research/JOB)
          OUTDIR="research/runs/${GITHUB_RUN_ID}-${JOB%.mjs}"
          mkdir -p "$OUTDIR"
          echo "OUTDIR=$OUTDIR" >> "$GITHUB_ENV"
          OUT="$PWD/$OUTDIR/" timeout 55m node "research/$JOB" > "$OUTDIR/log.txt" 2>&1 || echo "exit $?" >> "$OUTDIR/log.txt"
          tail -c 4000 "$OUTDIR/log.txt"
      - name: commit results
        if: always()
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add research/runs
          git commit -q -m "results $OUTDIR" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin research && git rebase -q origin/research && git push -q origin HEAD:research && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
