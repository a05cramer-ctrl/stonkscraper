<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quote arrivals</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1c2f; --panel: #15283f; --line: #213b58; --flap: #0a1626;
    --amber: #ffb627; --text: #eef2f6; --muted: #8ea3bb;
    --green: #43d17a; --sky: #6fc3ff; --red: #ff6b5b; --violet: #c792ea;
    --board: "Barlow Condensed", "Arial Narrow", sans-serif;
    --ui: "Barlow", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--ui); font-size: 16px; line-height: 1.45; }
  button { font: inherit; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 48px; }

  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 24px; margin-bottom: 22px; }
  h1 { font-family: var(--board); font-weight: 700; font-size: clamp(40px, 7vw, 64px); line-height: .92; margin: 0; letter-spacing: .01em; color: var(--amber); }
  .sub { color: var(--muted); margin: 8px 0 0; max-width: 46ch; }

  .status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: var(--panel); color: var(--text); font-size: 14px; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pill.ok .dot { background: var(--green); box-shadow: 0 0 0 0 rgba(67,209,122,.6); animation: beat 2s infinite; }
  .pill.warn .dot { background: var(--amber); }
  .pill.bad .dot { background: var(--red); }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(67,209,122,.55); } 70% { box-shadow: 0 0 0 8px rgba(67,209,122,0); } 100% { box-shadow: 0 0 0 0 rgba(67,209,122,0); } }
  .btn { border: 1px solid var(--line); background: transparent; color: var(--text); padding: 7px 14px; border-radius: 8px; font-weight: 500; font-size: 14px; }
  .btn:hover { border-color: var(--amber); }
  .btn.solid { background: var(--amber); border-color: var(--amber); color: #1a1200; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* the board */
  .board { background: var(--flap); border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
  .tabs { display: flex; gap: 4px; padding: 10px 10px 0; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { border: 0; background: transparent; color: var(--muted); font-family: var(--board); font-weight: 600; font-size: 20px; padding: 8px 14px 10px; border-radius: 8px 8px 0 0; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--flap); color: var(--text); }
  .tab .n { font-size: 15px; color: var(--amber); margin-left: 6px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th { text-align: left; font-weight: 500; font-size: 13px; color: var(--muted); padding: 12px 14px 8px; }
  td { padding: 0 14px; height: 52px; border-top: 1px solid #142a44; font-family: var(--board); font-size: 22px; font-weight: 500; white-space: nowrap; }
  td.tick { color: var(--amber); font-weight: 700; font-size: 26px; letter-spacing: .02em; }
  td.name { color: var(--text); font-weight: 500; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  td.time, td.vs { color: var(--muted); }
  td.num { font-variant-numeric: tabular-nums; }
  td.link { text-align: right; font-family: var(--ui); font-size: 14px; }
  td.link a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
  td.link a:hover { color: var(--text); }
  .st { font-size: 20px; font-weight: 600; }
  .st.coming { color: var(--amber); }
  .st.added { color: var(--amber); }
  .st.live { color: var(--green); }
  .st.deep { color: var(--sky); }
  .st.early { color: var(--violet); }
  td.why { color: var(--muted); font-size: 18px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
  td.rank { color: var(--muted); width: 1%; }
  .st.start, .st.error { color: var(--muted); }
  .odds { color: var(--green); font-weight: 600; }
  .cold { color: var(--muted); font-size: 18px; }
  td.tick.old { color: #c9a24a; }
  .flip td.tick span, .flip td .st { display: inline-block; animation: flap .7s cubic-bezier(.3,1.4,.5,1) both; transform-origin: 50% 60%; }
  @keyframes flap { 0% { transform: rotateX(90deg); opacity: .2; } 60% { transform: rotateX(-12deg); opacity: 1; } 100% { transform: none; } }
  .empty { padding: 36px 20px; color: var(--muted); font-size: 16px; }
  .empty strong { color: var(--text); font-weight: 600; display: block; font-family: var(--board); font-size: 24px; margin-bottom: 4px; }

  .legend { color: var(--muted); font-size: 14px; padding: 12px 14px 14px; border-top: 1px solid #142a44; }

  .below { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .card { background: var(--panel); border-radius: 12px; padding: 16px 18px; }
  .card h2 { font-family: var(--board); font-weight: 600; font-size: 24px; margin: 0 0 8px; }
  .card p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 15px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .err { color: var(--red); }

  .gate { max-width: 420px; margin: 18vh auto 0; padding: 0 20px; }
  .gate input { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--flap); color: var(--text); margin: 14px 0 10px; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }

  @media (max-width: 720px) {
    .below { grid-template-columns: 1fr; }
    td.name, th.name { display: none; }
    table { min-width: 520px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flip td.tick span, .flip td .st, .pill.ok .dot { animation: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const app = $('#app');
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // key: from ?key= once, then remembered
  const urlKey = new URL(location.href).searchParams.get('key');
  if (urlKey) { LS.set('sqw-key', urlKey); history.replaceState(null, '', location.pathname); }
  let KEY = LS.get('sqw-key');

  let tab = LS.get('sqw-tab') || 'arriving';
  let data = null;
  let lastSeen = +LS.get('sqw-seen') || 0;   // newest event already alerted on
  let flipAfter = Infinity;                   // events newer than this get the flap on render
  let alertsOn = LS.get('sqw-alerts') === '1';
  let scanning = false;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const usd = (n) => !n ? '' : n >= 1e6 ? `$${(n / 1e6).toFixed(1)}M` : `$${Math.round(n / 1e3)}K`;
  const et = (t) => {
    if (!t) return 'Before watch';
    const d = new Date(t), now = new Date();
    const opts = { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false };
    const sameDay = d.toLocaleDateString('en-US', { timeZone: 'America/New_York' }) === now.toLocaleDateString('en-US', { timeZone: 'America/New_York' });
    return sameDay ? d.toLocaleTimeString('en-US', opts) : d.toLocaleDateString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', opts);
  };
  const ago = (ms) => ms < 60e3 ? `${Math.max(1, Math.round(ms / 1e3))}s ago` : ms < 3600e3 ? `${Math.round(ms / 60e3)} min ago` : `${Math.round(ms / 3600e3)} h ago`;
  const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); };
  const chart = (m) => m ? `<a href="https://dexscreener.com/solana/${esc(m)}" target="_blank" rel="noopener">Chart</a>` : '';
  const STATUS = { early: 'Early', coming: 'Arriving', added: 'Boarding', live: 'Landed', deep: 'On radar', start: 'Watch started', error: 'Scan errors', test: 'Test ping' };
  const KIND = { 'sf-top': 'Top StonkFun launch', 'sunrise-scheduled': 'Sunrise scheduled', 'sunrise-live': 'Live on Sunrise', 'stonkfun-soon': 'SOON on StonkFun', 'backpack-on': 'Backpack switched on' };
  const age = (b) => { if (!b) return ''; const d = (Date.now() - b) / 864e5; return d < 1 ? `${Math.max(1, Math.round(d * 24))} h` : `${Math.round(d)} d`; };

  async function api(path, extra) {
    const r = await fetch(`/api/${path}?key=${encodeURIComponent(KEY)}${extra ? '&' + extra : ''}`, { cache: 'no-store' });
    const j = await r.json().catch(() => ({ error: `Server returned ${r.status}` }));
    if (r.status === 401) { LS.del('sqw-key'); KEY = null; gate('That key was wrong. Paste the WATCH_KEY from Vercel.'); throw new Error('401'); }
    if (!r.ok) throw new Error(j.error || `Server returned ${r.status}`);
    return j;
  }

  function gate(msg) {
    app.innerHTML = `<div class="gate">
      <h1>Quote arrivals</h1>
      <p class="sub">${esc(msg || 'Enter your WATCH_KEY to open the board.')}</p>
      <form id="kf"><label for="k" class="sub">Key</label><input id="k" autocomplete="off" spellcheck="false" autofocus><button class="btn solid" type="submit">Open board</button></form>
    </div>`;
    $('#kf').onsubmit = (e) => { e.preventDefault(); const v = $('#k').value.trim(); if (!v) return; KEY = v; LS.set('sqw-key', v); boot(); };
  }

  function shell() {
    app.innerHTML = `<div class="wrap">
      <header>
        <div><h1>Quote arrivals</h1><p class="sub">New StonkFun quote pairs, caught before and while Raydium sets them up.</p></div>
        <div class="status"><span class="pill" id="pill"><span class="dot"></span><span id="pilltxt">Loading</span></span><button class="btn" id="scan">Scan now</button></div>
      </header>
      <section class="board" aria-label="Quote board">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="scroll" id="rows"></div>
        <div class="legend" id="legend"></div>
      </section>
      <div class="below">
        <div class="card">
          <h2>Pings</h2>
          <p id="pingto">Pings go to your phone. Desktop alerts work while this tab is open.</p>
          <div class="row"><button class="btn" id="alerts"></button><button class="btn" id="testping">Send test ping</button><button class="btn" id="digestnow">Send digest now</button></div>
        </div>
        <div class="card"><h2>Last scan</h2><dl id="scaninfo"></dl></div>
      </div>
    </div>`;
    $('#scan').onclick = () => scan(true);
    $('#testping').onclick = async () => { try { const r = await api('test'); toast(r.sent ? 'Test ping sent' : r.skipped); } catch (e) { if (e.message !== '401') toast(e.message); } };
    $('#digestnow').onclick = async () => { try { const r = await api('test', 'what=digest'); toast(r.sent ? 'Digest sent' : r.skipped); } catch (e) { if (e.message !== '401') toast(e.message); } };
    $('#alerts').onclick = toggleAlerts;
    paintAlerts();
  }

  function paintAlerts() { const b = $('#alerts'); if (b) b.textContent = alertsOn ? 'Desktop alerts on' : 'Turn on desktop alerts'; }
  async function toggleAlerts() {
    if (alertsOn) { alertsOn = false; LS.set('sqw-alerts', '0'); paintAlerts(); return; }
    if (!('Notification' in window)) { toast('This browser has no desktop alerts'); return; }
    const p = await Notification.requestPermission();
    if (p !== 'granted') { toast('Alerts are blocked for this site in your browser settings'); return; }
    alertsOn = true; LS.set('sqw-alerts', '1'); paintAlerts(); beep(); toast('Desktop alerts on');
  }
  let actx;
  function beep() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      [0, .18].forEach((d, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = i ? 1175 : 880; g.gain.setValueAtTime(.0001, actx.currentTime + d); g.gain.exponentialRampToValueAtTime(.18, actx.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d + .16); o.connect(g).connect(actx.destination); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + .18); });
    } catch {}
  }

  function row(cells, flip) { return `<tr class="${flip ? 'flip' : ''}">${cells}</tr>`; }
  function paint() {
    if (!data) return;
    const d = data;
    const log = d.events.filter((e) => e.type !== 'test');
    const tabs = [
      ['likely', 'Likely next', (d.likely || []).length],
      ['arriving', 'Arriving', d.arriving.length + (d.early || []).length],
      ['boarding', 'Boarding', d.boarding.length],
      ['oldarr', 'Old arriving', (d.oldArriving || []).length],
      ['oldboard', 'Old boarding', (d.oldBoarding || []).length],
      ['log', 'Log', log.length],
    ];
    $('#tabs').innerHTML = tabs.map(([id, label, n]) => `<button class="tab" role="tab" aria-selected="${tab === id}" data-t="${id}">${label}<span class="n">${n}</span></button>`).join('');
    $('#tabs').querySelectorAll('.tab').forEach((b) => (b.onclick = () => { tab = b.dataset.t; LS.set('sqw-tab', tab); paint(); }));

    let html = '', legend = '';
    if (tab === 'likely') {
      const L = d.likely || [];
      legend = `Tokens StonkFun doesn’t list yet, ranked by how likely they are to be next: new Sunrise listings, StonkFun’s own big launches, PreStock/Tessera/Backpack stocks, then verified tokens by liquidity, 24 h volume and newness. Raydium set-up and EARLY ones go to the top.${d.digestHour >= 0 ? ` Top 15 goes to Discord every day at ${String(d.digestHour).padStart(2, '0')}:00 ET.` : ''}${d.likelyAt ? ` Ranked ${ago(d.now - d.likelyAt)}.` : ''}`;
      html = L.length ? `<table><thead><tr><th>#</th><th>Ticker</th><th class="name">Name</th><th>Liquidity</th><th>24h vol</th><th>Age</th><th class="why">Why</th><th></th></tr></thead><tbody>${
        L.map((r) => row(`<td class="rank num">${r.rank}</td><td class="tick"><span>${esc(r.sym)}</span></td><td class="name">${esc(r.name)}</td><td class="num">${esc(usd(r.liq))}</td><td class="num">${esc(usd(r.vol))}</td><td class="num time">${esc(age(r.born))}</td><td class="why">${esc(r.why || '')}</td><td class="link">${chart(r.mint)}</td>`)).join('')
      }</tbody></table>` : `<div class="empty"><strong>Nothing ranked yet</strong>The list fills in after the next scan.</div>`;
    } else if (tab === 'arriving') {
      const o = d.odds || {};
      const E = (d.early || []).filter((e) => !e.setUp);
      const pct = o.pct != null ? Math.round(o.pct * 100) + '%' : '—';
      legend = (E.length ? 'Early = a source that moves before StonkFun (Sunrise schedule, Backpack, StonkFun SOON). ' : '') + (o.basis === 'own'
        ? `Chance = how many arrivals ended up on StonkFun since the watch started: ${o.landed} of ${o.decided}${o.medianHours != null ? `, usually ${o.medianHours < 1 ? Math.max(1, Math.round(o.medianHours * 60)) + ' min' : o.medianHours.toFixed(1) + ' h'} after arriving` : ''}. No move in 3 days = going cold.`
        : `Chance = share of tokens Raydium has set up that StonkFun lists: ${o.listed ?? 0} of ${(o.listed ?? 0) + (o.unlisted ?? 0)}. Switches to the watcher’s own track record after 5 arrivals. No move in 3 days = going cold.`);
      html = d.arriving.length || E.length ? `<table><thead><tr><th>Seen</th><th>Ticker</th><th class="name">Name</th><th>Liquidity</th><th>Chance</th><th></th></tr></thead><tbody>${
        E.map((e) => row(`<td class="time">${esc(et(e.t))}</td><td class="tick"><span>${esc(e.sym)}</span></td><td class="name">${esc(KIND[e.kind] || e.kind)}</td><td class="num"></td><td class="num"><span class="st early">Early</span></td><td class="link">${chart(e.mint)}</td>`, e.t > flipAfter)).join('')
      }${
        d.arriving.map((a) => row(`<td class="time">${esc(et(a.t))}</td><td class="tick"><span>${esc(a.sym)}</span></td><td class="name">${esc(a.name)}</td><td class="num">${esc(usd(a.tvl))}</td><td class="num">${a.cold ? '<span class="cold">Going cold</span>' : `<span class="odds">${pct}</span>`}</td><td class="link">${chart(a.mint)}</td>`, a.t > flipAfter)).join('')
      }</tbody></table>` : `<div class="empty"><strong>Nothing new arriving</strong>When Raydium sets up a new quote that StonkFun doesn’t have yet, it lands here with its chance and you get pinged. Chance right now: ${pct}.</div>`;
    } else if (tab === 'boarding') {
      legend = 'New on StonkFun’s list but not launchable yet.';
      html = d.boarding.length ? `<table><thead><tr><th>Seen</th><th>Ticker</th><th>Type</th><th></th></tr></thead><tbody>${
        d.boarding.map((b) => row(`<td class="time">${esc(et(b.t))}</td><td class="tick"><span>${esc(b.sym)}</span></td><td class="vs">${esc(b.cat)}</td><td class="link">${chart(b.mint)}</td>`, b.t > flipAfter)).join('')
      }</tbody></table>` : `<div class="empty"><strong>Nothing boarding</strong>When StonkFun adds a pair that isn’t launchable yet, it lands here and you get pinged.</div>`;
    } else if (tab === 'oldarr') {
      const L = d.oldArriving || [];
      legend = 'Raydium set these up before the watch started and StonkFun still doesn’t list them. They could have been sitting there for months, so the odds are low. You get pinged if one goes live.';
      html = L.length ? `<table><thead><tr><th>Ticker</th><th class="name">Name</th><th>Liquidity</th><th>Paired vs</th><th></th></tr></thead><tbody>${
        L.map((a) => row(`<td class="tick old"><span>${esc(a.sym)}</span></td><td class="name">${esc(a.name)}</td><td class="num">${esc(usd(a.tvl))}</td><td class="vs">${esc(a.vs)}</td><td class="link">${chart(a.mint)}</td>`)).join('')
      }</tbody></table>` : `<div class="empty"><strong>Nothing here</strong>No old arrivals left.</div>`;
    } else if (tab === 'oldboard') {
      const L = d.oldBoarding || [];
      legend = 'On StonkFun’s list since before the watch started, but still not launchable. You get pinged the moment one goes live.';
      html = L.length ? `<table><thead><tr><th>Ticker</th><th>Type</th><th></th></tr></thead><tbody>${
        L.map((b) => row(`<td class="tick old"><span>${esc(b.sym)}</span></td><td class="vs">${esc(b.cat)}</td><td class="link">${chart(b.mint)}</td>`)).join('')
      }</tbody></table>` : `<div class="empty"><strong>Nothing here</strong>Every old pair on StonkFun’s list is launchable now.</div>`;
    } else {
      legend = 'Everything the watcher has pinged, newest first. Early comes before Raydium’s setup. Arriving and Boarding come just before launch. Landed means launchable. On radar is new real money ($500K+) — early, can be noise.';
      html = log.length ? `<table><thead><tr><th>Time (ET)</th><th>Ticker</th><th class="name">Name</th><th>Status</th><th>Liquidity</th><th></th></tr></thead><tbody>${
        log.map((e) => row(`<td class="time">${esc(et(e.t))}</td><td class="tick"><span>${esc(e.sym || '—')}</span></td><td class="name">${esc(e.name || e.body || '')}</td><td><span class="st ${esc(e.type)}">${esc(STATUS[e.type] || e.type)}</span></td><td class="num">${esc(usd(e.tvl))}</td><td class="link">${chart(e.mint)}</td>`, e.t > flipAfter)).join('')
      }</tbody></table>` : `<div class="empty"><strong>No pings yet</strong>The first scan sets the baseline. Pings start after that.</div>`;
    }
    $('#rows').innerHTML = html;
    $('#legend').textContent = legend;
    if (d.pingTo && d.pingTo.length) $('#pingto').textContent = `Pings go to ${d.pingTo.join(' and ')}. Desktop alerts work while this tab is open.`;

    // status pill + scan info
    const r = d.run, pill = $('#pill'), txt = $('#pilltxt');
    pill.className = 'pill';
    if (!r) { pill.classList.add('warn'); txt.textContent = 'No scan yet'; }
    else {
      const age = d.now - r.t;
      if (age > 5 * 60e3) { pill.classList.add('bad'); txt.textContent = `No scan for ${ago(age).replace(' ago', '')}`; }
      else if (!r.ok) { pill.classList.add('warn'); txt.textContent = `Last scan had errors · ${ago(age)}`; }
      else { pill.classList.add('ok'); txt.textContent = `Scanning · last scan ${ago(age)}`; }
    }
    $('#scaninfo').innerHTML = r ? `
      <dt>When</dt><dd>${esc(et(r.t))} ET</dd>
      <dt>Took</dt><dd>${Math.max(.1, r.ms / 1000).toFixed(1)}s</dd>
      <dt>StonkFun pairs</dt><dd>${r.pairs ?? '—'}</dd>
      <dt>Tokens watched</dt><dd>${r.mints ?? '—'} (Raydium $50K+ and Jupiter-verified), plus Sunrise, Backpack and StonkFun’s launch page</dd>
      ${r.errors && r.errors.length ? `<dt>Errors</dt><dd class="err">${esc(r.errors.join('; '))}</dd>` : ''}
      ${r.warn && r.warn.length ? `<dt>Side sources</dt><dd class="err">${esc(r.warn.join('; '))}</dd>` : ''}
      ${d.run && d.now - d.run.t > 5 * 60e3 ? `<dt>Fix</dt><dd>Check the cron job at cron-job.org is on and hits /api/check every minute.</dd>` : ''}`
      : `<dt>Status</dt><dd>Waiting for the first scan.</dd>`;
  }

  function alertNew() {
    const fresh = data.events.filter((e) => e.t > lastSeen && ['early', 'coming', 'added', 'live', 'deep'].includes(e.type));
    if (!fresh.length) return;
    if (alertsOn && lastSeen) {
      beep();
      fresh.slice(0, 5).forEach((e) => { try { new Notification(`${STATUS[e.type]}: ${e.sym}`, { body: `${e.name || ''} ${e.tvl ? '· ' + usd(e.tvl) : ''}`.trim(), tag: e.mint + e.type }); } catch {} });
    }
    flipAfter = lastSeen || Infinity;
    lastSeen = Math.max(...data.events.map((e) => e.t || 0));
    LS.set('sqw-seen', lastSeen);
  }

  async function refresh() {
    try {
      data = await api('state');
      if (!lastSeen) { lastSeen = Math.max(0, ...data.events.map((e) => e.t || 0)); LS.set('sqw-seen', lastSeen); }
      alertNew();
      paint();
      // no cron hit lately and the tab is open: scan from here
      if (!scanning && document.visibilityState === 'visible' && (!data.run || data.now - data.run.t > 90e3)) scan(false);
    } catch (e) {
      if (e.message !== '401') { const t = $('#pilltxt'); if (t) { $('#pill').className = 'pill bad'; t.textContent = e.message; } }
    }
  }

  async function scan(manual) {
    if (scanning) return;
    scanning = true;
    const b = $('#scan'); if (b) { b.disabled = true; b.textContent = 'Scanning'; }
    try {
      const r = await api('check');
      if (manual) toast(r.skipped ? `Skipped: ${r.skipped}` : r.ok ? `Scan done in ${(r.ms / 1000).toFixed(1)}s` : `Scan had errors`);
    } catch (e) { if (manual && e.message !== '401') toast(e.message); }
    scanning = false;
    if (b) { b.disabled = false; b.textContent = 'Scan now'; }
    await refresh();
  }

  function boot() {
    if (!KEY) return gate();
    shell();
    refresh();
    clearInterval(boot.h); boot.h = setInterval(refresh, 20000);
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && KEY) refresh(); });
  boot();
})();
</script>
</body>
</html>
